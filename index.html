<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوتات الأرقام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ===== الصفحة الرئيسية ===== */
        #mainPage {
            display: block;
        }

        #notePage {
            display: none;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .name-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid transparent;
        }

        .name-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .name-card:active {
            transform: translateY(-4px);
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card-name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .card-count {
            font-size: 14px;
            color: #999;
        }

        /* ===== صفحة النوتة ===== */
        .note-header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .note-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #764ba2;
            transform: translateX(3px);
        }

        .note-icon {
            font-size: 32px;
        }

        .note-name {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .add-form {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .notes-list {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .notes-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .note-item {
            background: #f8f9fa;
            border-right: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .note-number {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-left: 15px;
            min-width: 30px;
            text-align: center;
        }

        .note-item:hover {
            background: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .note-info {
            flex: 1;
        }

        .note-phone {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            direction: ltr;
            text-align: left;
        }

        .note-details {
            display: flex;
            gap: 25px;
            font-size: 13px;
            color: #666;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .detail-label {
            color: #999;
            font-weight: 500;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 15px;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }

            .names-grid {
                grid-template-columns: 1fr;
            }

            .note-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .note-title {
                flex-direction: column;
                gap: 10px;
            }

            .back-btn {
                width: 100%;
            }

            .input-row {
                grid-template-columns: 1fr;
            }

            .note-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .note-phone {
                text-align: right;
            }

            .note-details {
                flex-direction: column;
                gap: 8px;
            }

            .delete-btn {
                width: 100%;
            }
        }

        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- ===== الصفحة الرئيسية ===== -->
    <div id="mainPage">
        <div class="container">
            <div class="header">
                <h1>📓 نوتات الأرقام</h1>
                <p>اختر اسم للدخول لنوتته</p>
            </div>

            <div class="names-grid">
                <div class="name-card" onclick="openNote('owner7', 'Owner 7')">
                    <div class="card-icon">👤</div>
                    <div class="card-name">Owner 7</div>
                    <div class="card-count" id="count-owner7">0 أرقام</div>
                </div>

                <div class="name-card" onclick="openNote('owner11', 'Owner 11')">
                    <div class="card-icon">👤</div>
                    <div class="card-name">Owner 11</div>
                    <div class="card-count" id="count-owner11">0 أرقام</div>
                </div>

                <div class="name-card" onclick="openNote('owner25', 'Owner 25')">
                    <div class="card-icon">👤</div>
                    <div class="card-name">Owner 25</div>
                    <div class="card-count" id="count-owner25">0 أرقام</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== صفحة النوتة ===== -->
    <div id="notePage">
        <div class="container">
            <div class="note-header">
                <div class="note-title">
                    <div class="note-icon">📝</div>
                    <div class="note-name" id="currentNoteName">Owner 7</div>
                </div>
                <button class="back-btn" onclick="backToMain()">← رجوع</button>
            </div>

            <div class="add-form">
                <form id="addNoteForm" onsubmit="addNote(event)">
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="phoneInput" placeholder="مثال: 01234567890" required>
                    </div>
                    <div class="input-row">
                        <div class="form-group">
                            <label>الجيجابايت (GB)</label>
                            <input type="number" id="gbInput" placeholder="0" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>الدقائق</label>
                            <input type="number" id="minutesInput" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">➕ إضافة</button>
                </form>
            </div>

            <div class="notes-list">
                <div class="notes-title">الأرقام المحفوظة</div>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 ابحث عن رقم..." onkeyup="searchNotes()">
                </div>
                
                <div id="notesList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentOwner = null;

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('load', () => {
            updateCounts();
        });

        // فتح النوتة
        function openNote(owner, name) {
            currentOwner = owner;
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('notePage').style.display = 'block';
            document.getElementById('currentNoteName').textContent = name;
            document.getElementById('addNoteForm').reset();
            renderNotes();
            document.getElementById('phoneInput').focus();
        }

        // رجوع للصفحة الرئيسية
        function backToMain() {
            currentOwner = null;
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('notePage').style.display = 'none';
            updateCounts();
        }

        // إضافة رقم جديد
        function addNote(e) {
            e.preventDefault();

            const phone = document.getElementById('phoneInput').value.trim();
            const gb = parseFloat(document.getElementById('gbInput').value) || 0;
            const minutes = parseFloat(document.getElementById('minutesInput').value) || 0;

            if (!phone) {
                alert('الرجاء إدخال رقم الهاتف');
                return;
            }

            // الحصول على البيانات الموجودة
            let data = [];
            const existing = localStorage.getItem(currentOwner);
            if (existing) {
                try {
                    data = JSON.parse(existing);
                } catch (e) {
                    data = [];
                }
            }

            // إضافة الرقم الجديد
            const newNote = {
                id: Date.now(),
                phone: phone,
                gb: gb,
                minutes: minutes
            };

            data.push(newNote);
            localStorage.setItem(currentOwner, JSON.stringify(data));

            // تحديث العرض
            renderNotes();
            document.getElementById('addNoteForm').reset();
            document.getElementById('phoneInput').focus();
        }

        // حذف رقم
        function deleteNote(id) {
            if (!confirm('هل تريد حذف هذا الرقم؟')) {
                return;
            }

            let data = [];
            const existing = localStorage.getItem(currentOwner);
            if (existing) {
                try {
                    data = JSON.parse(existing);
                } catch (e) {
                    data = [];
                }
            }

            data = data.filter(item => item.id !== id);

            if (data.length === 0) {
                localStorage.removeItem(currentOwner);
            } else {
                localStorage.setItem(currentOwner, JSON.stringify(data));
            }

            renderNotes();
        }

        // عرض النوتات
        function renderNotes() {
            let data = [];
            const existing = localStorage.getItem(currentOwner);
            if (existing) {
                try {
                    data = JSON.parse(existing);
                } catch (e) {
                    data = [];
                }
            }

            const notesList = document.getElementById('notesList');
            document.getElementById('searchInput').value = '';

            if (!data || data.length === 0) {
                notesList.innerHTML = '<div class="empty-message"><div class="empty-icon">📭</div>لا توجد أرقام محفوظة</div>';
                return;
            }

            notesList.innerHTML = data.map((item, index) => `
                <div class="note-item">
                    <div style="display: flex; align-items: center; flex: 1;">
                        <div class="note-number">${index + 1}</div>
                        <div class="note-info">
                            <div class="note-phone">${item.phone}</div>
                            <div class="note-details">
                                <div class="detail-item">
                                    <span class="detail-label">💾 الجيجابايت:</span>
                                    <span>${item.gb} GB</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">⏱️ الدقائق:</span>
                                    <span>${item.minutes} دقيقة</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="delete-btn" onclick="deleteNote(${item.id})">🗑️ حذف</button>
                </div>
            `).join('');
        }

        // البحث عن الأرقام
        function searchNotes() {
            const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
            
            let data = [];
            const existing = localStorage.getItem(currentOwner);
            if (existing) {
                try {
                    data = JSON.parse(existing);
                } catch (e) {
                    data = [];
                }
            }

            const notesList = document.getElementById('notesList');

            // إذا كانت خانة البحث فارغة، عرض كل الأرقام
            if (!searchValue) {
                renderNotes();
                return;
            }

            // البحث عن الأرقام المطابقة
            const filteredData = data.filter(item => 
                item.phone.includes(searchValue)
            );

            if (filteredData.length === 0) {
                notesList.innerHTML = '<div class="empty-message"><div class="empty-icon">🔍</div>لم يتم العثور على أرقام</div>';
                return;
            }

            notesList.innerHTML = filteredData.map((item, index) => `
                <div class="note-item">
                    <div style="display: flex; align-items: center; flex: 1;">
                        <div class="note-number">${index + 1}</div>
                        <div class="note-info">
                            <div class="note-phone">${item.phone}</div>
                            <div class="note-details">
                                <div class="detail-item">
                                    <span class="detail-label">💾 الجيجابايت:</span>
                                    <span>${item.gb} GB</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">⏱️ الدقائق:</span>
                                    <span>${item.minutes} دقيقة</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="delete-btn" onclick="deleteNote(${item.id})">🗑️ حذف</button>
                </div>
            `).join('');
        }

        // تحديث عدد الأرقام
        function updateCounts() {
            const owners = ['owner7', 'owner11', 'owner25'];
            owners.forEach(owner => {
                let data = [];
                const existing = localStorage.getItem(owner);
                if (existing) {
                    try {
                        data = JSON.parse(existing);
                    } catch (e) {
                        data = [];
                    }
                }
                const count = data.length;
                document.getElementById(`count-${owner}`).textContent = `${count} ${count === 1 ? 'رقم' : 'أرقام'}`;
            });
        }
    </script>
</body>
</html>
