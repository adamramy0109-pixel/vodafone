<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الأرقام والتفعيلات</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 15px; color: #333; }
.container { max-width: 1000px; margin: 0 auto; padding-bottom: 350px; }

.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; position: fixed; inset: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 999; padding: 20px; }
.login-card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 400px; }
.login-card h1 { font-size: 28px; color: #333; margin-bottom: 20px; }
.login-card input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; }
.login-card button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; }
.error { color: #ff6b6b; margin-bottom: 15px; font-weight: 600; min-height: 20px; }
.hidden { display: none !important; }

.main-page { display: none; }
.header { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header h1 { color: #333; font-size: 20px; }
.user-info { display: flex; gap: 10px; align-items: center; }
.badge { background: #667eea; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.badge.admin { background: #dc3545; }
.logout-btn { background: #ff6b6b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }

.nav { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 12px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); flex-wrap: wrap; }
.nav button { padding: 10px 15px; border: none; background: #f0f0f0; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.nav button.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }

.page { display: none; }
.page.active { display: block; }
.section { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.section h2 { font-size: 18px; color: #333; margin-bottom: 15px; border-bottom: 3px solid #667eea; padding-bottom: 12px; }
.button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.btn { padding: 15px 10px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: transform 0.2s; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
.btn-success { background: #51cf66; color: white; }
.btn-danger { background: #ff6b6b; color: white; }

.modal { display: none; position: fixed; z-index: 999; inset: 0; background: rgba(0,0,0,0.6); padding: 20px; overflow-y: auto; }
.modal.show { display: block; }
.modal-content { background: white; margin: 5% auto; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
.modal-input, .modal-select { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: white; }
.modal-input:focus, .modal-select:focus { outline: none; border-color: #667eea; }
.form-label { display: block; color: #555; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
.modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
.modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
.modal-btn-ok { background: #51cf66; color: white; }
.modal-btn-cancel { background: #ddd; color: #333; }

.owner-row { display: flex; align-items: center; gap: 8px; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; }
.owner-row .owner-info { flex: 1; font-size: 13px; }
.owner-row .owner-info strong { display: block; color: #333; }
.owner-row .owner-info small { color: #888; font-size: 11px; }
.owner-row button { background: #ff6b6b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

.notification { position: fixed; top: 20px; right: 20px; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 5px 25px rgba(0,0,0,0.25); z-index: 99999; font-weight: 600; font-size: 14px; max-width: 320px; animation: slideIn 0.3s ease; }
.notification.success { border-right: 4px solid #51cf66; color: #2b8a3e; }
.notification.error { border-right: 4px solid #ff6b6b; color: #c92a2a; }
.notification.info { border-right: 4px solid #74c0fc; color: #1864ab; }
@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.terminal-container { position: fixed; bottom: 0; left: 0; right: 0; height: 320px; background: #0d1117; border-top-left-radius: 15px; border-top-right-radius: 15px; box-shadow: 0 -5px 25px rgba(0,0,0,0.4); z-index: 9998; display: none; flex-direction: column; }
.terminal-header { background: #161b22; color: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; border-top-left-radius: 15px; border-top-right-radius: 15px; }
.terminal-header .title { display: flex; align-items: center; gap: 8px; }
.terminal-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #51cf66; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.terminal-actions button { background: #30363d; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; margin-right: 5px; }
.terminal-body { flex: 1; padding: 12px 15px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12.5px; direction: ltr; text-align: left; line-height: 1.6; }
.term-line { margin-bottom: 2px; word-wrap: break-word; }
.term-info { color: #74c0fc; }
.term-success { color: #51cf66; }
.term-error { color: #ff6b6b; }
.term-warn { color: #ffd43b; }
.term-default { color: #8b949e; }
.term-time { color: #6e7681; margin-right: 8px; }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
<div class="login-card">
<h1>🔐 الدخول</h1>
<div class="error" id="loginError"></div>
<input type="password" id="codeInput" placeholder="أدخل الكود" onkeypress="if(event.key==='Enter') login()">
<button onclick="login()">دخول</button>
</div>
</div>

<div class="main-page" id="mainPage">
<div class="container">
<div class="header">
<h1>📱 نظام التفعيلات</h1>
<div class="user-info">
<div class="badge admin" id="userBadge">🛡️ أدمن</div>

</div>

<div class="nav">

<button onclick="showPage('owners', this)">👥 الأونرز</button>
<button onclick="showPage('admin', this)">🛡️ الإدارة</button>
</div>

<button class="btn btn-primary" onclick="openModal('unlock')">🔓 فك اليمت</button>
</div>
</div>
</div>

<div class="page" id="ownersPage">
<div class="section">
<h2>👥 إدارة الأونرز</h2>
<p style="color:#666; font-size:13px; margin-bottom:15px;">الأونرز محفوظين في متصفحك (localStorage).</p>
<button class="btn btn-success" style="width:100%; margin-bottom:15px;" onclick="openModal('addowner')">➕ إضافة أونر جديد</button>

</div>

</div>

<label class="form-label">🔑 باسورد العضو</label>
<input type="password" id="nosplitPass" class="modal-input" placeholder="باسورد العضو">
<label class="form-label">📦 الباقة</label>

<option value="">-- اختر الباقة --</option>
<option value="25|2500">25 GB + 2500 دقيقة</option>
<option value="30|3000">30 GB + 3000 دقيقة</option>
<option value="35|3500">35 GB + 3500 دقيقة</option>
<option value="40|4000">40 GB + 4000 دقيقة</option>

<div class="modal-buttons">

<script>
// ==================== الإعدادات ====================
const MASTER_CODE = '01019092631';
const BACKEND_URL = 'https://headphones-scoop-overcome-extensions.trycloudflare.com';
const SESSION_ID = 'sess_' + Math.random().toString(36).substr(2, 9);

let currentEventSource = null;
let terminalOpen = false;

function getOwners() {
try { return JSON.parse(localStorage.getItem('owners') || '[]'); }
catch(e) { return []; }
}
function saveOwners(list) { localStorage.setItem('owners', JSON.stringify(list)); }

function login() {
const code = document.getElementById('codeInput').value.trim();
const error = document.getElementById('loginError');
if (!code) { error.textContent = '⚠️ أدخل الكود'; return; }
if (code === MASTER_CODE) {
localStorage.setItem('loggedIn', 'true');
showMainPage();
} else { error.textContent = '❌ كود غير صحيح'; }
}
function logout() {
if (confirm('تسجيل خروج؟')) { localStorage.removeItem('loggedIn'); location.reload(); }
}
function showMainPage() {
document.getElementById('loginPage').classList.add('hidden');
document.getElementById('mainPage').style.display = 'block';
loadOwners();
}

function showPage(page, btn) {
document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
document.getElementById(page + 'Page').classList.add('active');
if (btn) btn.classList.add('active');
if (page === 'owners') renderOwners();
}

function loadOwners() {
const owners = getOwners();
['splitOwnerSelect', 'nosplitOwnerSelect', 'checkOwnerSelect'].forEach(id => {
const sel = document.getElementById(id);
if (!sel) return;
sel.innerHTML = '<option value="">-- اختر الأونر --</option>';
owners.forEach((o, i) => {
const opt = document.createElement('option');
opt.value = i;
opt.textContent = (o.label || o.phone) + ' — ' + o.phone;
sel.appendChild(opt);
});
const optManual = document.createElement('option');
optManual.value = 'manual';
optManual.textContent = '✏️ إدخال يدوي';
sel.appendChild(optManual);
});
}

function renderOwners() {
const owners = getOwners();
const list = document.getElementById('ownersList');
if (owners.length === 0) {
list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">مفيش أونرز محفوظين</p>';
return;
}
list.innerHTML = '';
owners.forEach((o, i) => {
const row = document.createElement('div');
row.className = 'owner-row';
row.innerHTML = `<div class="owner-info"><strong>${o.label || o.phone}</strong><small>${o.phone}</small></div>
<button onclick="removeOwner(${i})">🗑️ حذف</button>`;
list.appendChild(row);
});
}

function addOwner() {
const label = document.getElementById('newOwnerLabel').value.trim();
const phone = document.getElementById('newOwnerPhone').value.trim();
const pass = document.getElementById('newOwnerPass').value.trim();
if (!phone || !pass) { notify('⚠️ الرقم والباسورد مطلوبين', 'error'); return; }
const owners = getOwners();
owners.push({ label: label || phone, phone, password: pass });
saveOwners(owners);
loadOwners(); renderOwners();
notify('✅ تم إضافة الأونر', 'success');
closeModal('addowner');
document.getElementById('newOwnerLabel').value = '';
document.getElementById('newOwnerPhone').value = '';
document.getElementById('newOwnerPass').value = '';
}

function removeOwner(index) {
if (!confirm('حذف الأونر؟')) return;
const owners = getOwners();
owners.splice(index, 1);
saveOwners(owners);
loadOwners(); renderOwners();
notify('🗑️ تم الحذف', 'success');
}

function onOwnerSelect(prefix) {
const sel = document.getElementById(prefix + 'OwnerSelect');
const manual = document.getElementById(prefix + 'OwnerManual');
if (!sel || !manual) return;
if (sel.value === 'manual') manual.classList.remove('hidden');
else manual.classList.add('hidden');
}

function getOwnerData(prefix) {
const sel = document.getElementById(prefix + 'OwnerSelect');
if (!sel) return null;
if (sel.value === 'manual') {
const phone = document.getElementById(prefix + 'OwnerPhone').value.trim();
const pass = document.getElementById(prefix + 'OwnerPass').value.trim();
if (!phone || !pass) return null;
return { phone, password: pass };
}
if (sel.value === '') return null;
const owners = getOwners();
const idx = parseInt(sel.value);
if (isNaN(idx) || !owners[idx]) return null;
return { phone: owners[idx].phone, password: owners[idx].password };
}

function openModal(name) {
const m = document.getElementById(name + 'Modal');
if (m) m.classList.add('show');
if (name === 'code') generateCode();
}
function closeModal(name) {
const m = document.getElementById(name + 'Modal');
if (m) m.classList.remove('show');
}

async function apiCall(endpoint, body) {
body.session_id = SESSION_ID;
const response = await fetch(BACKEND_URL + endpoint, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(body)
});
const data = await response.json().catch(() => ({}));
if (!response.ok) throw new Error(data.message || 'Server Error');
return data;
}

async function executeSplit() {
const owner = getOwnerData('split');
if (!owner) { notify('⚠️ اختر أونر أو أدخل بياناته', 'error'); return; }
const phone = document.getElementById('splitPhone').value.trim();
const pass = document.getElementById('splitPass').value.trim();
const plan = document.getElementById('splitPlan').value;
if (!phone || !pass || !plan) { notify('⚠️ املأ كل الحقول', 'error'); return; }
const [gb, minutes] = plan.split('|');
openTerminal();
termLog('🚀 بدء تطير مع تقسيم للرقم: ' + phone, 'info');
try {
await apiCall('/api/split-transfer', { phone, gb, minutes, owner_phone: owner.phone, owner_password: owner.password });
notify('✅ تم التنفيذ', 'success');
closeModal('split');
} catch(e) { notify('❌ ' + e.message, 'error'); termLog('❌ ' + e.message, 'error'); }
}

async function executeNoSplit() {
const owner = getOwnerData('nosplit');
if (!owner) { notify('⚠️ اختر أونر أو أدخل بياناته', 'error'); return; }
const phone = document.getElementById('nosplitPhone').value.trim();
const pass = document.getElementById('nosplitPass').value.trim();
const plan = document.getElementById('nosplitPlan').value;
if (!phone || !pass || !plan) { notify('⚠️ املأ كل الحقول', 'error'); return; }
const [gb, minutes] = plan.split('|');
openTerminal();
termLog('✈️ بدء تطير بدون تقسيم للرقم: ' + phone, 'info');
try {
await apiCall('/api/nosplit-transfer', { phone, gb, minutes, owner_phone: owner.phone, owner_password: owner.password });
notify('✅ تم التنفيذ', 'success');
closeModal('nosplit');
} catch(e) { notify('❌ ' + e.message, 'error'); termLog('❌ ' + e.message, 'error'); }
}

async function executeCheckDays() {
const owner = getOwnerData('check');
if (!owner) { notify('⚠️ اختر أونر أو أدخل بياناته', 'error'); return; }
openTerminal();
termLog('📊 بدء كشف الحد اليومي...', 'info');
try {
const data = await apiCall('/api/check-daily-limit', { owner_phone: owner.phone, owner_password: owner.password });
notify('✅ ' + (data.message || 'تم الكشف'), 'success');
closeModal('checkdays');
} catch(e) { notify('❌ ' + e.message, 'error'); termLog('❌ ' + e.message, 'error'); }
}

async function executeTransfer() {
const phone = document.getElementById('transferPhone').value.trim();
const pass = document.getElementById('transferPass').value.trim();
let percent = document.getElementById('transferPercent').value;
const percentManual = document.getElementById('transferPercentManual').value.trim();
if (percentManual) percent = percentManual;
if (!phone || !pass || !percent) { notify('⚠️ املأ كل الحقول', 'error'); return; }
openTerminal();
termLog('🔄 بدء تحويل الأرقام...', 'info');
try {
await apiCall('/api/transfer-number', { phone, password: pass, percentage: percent });
notify('✅ تم التحويل', 'success');
closeModal('transfer');
} catch(e) { notify('❌ ' + e.message, 'error'); termLog('❌ ' + e.message, 'error'); }
}

async function generateCode() {
document.getElementById('newCode').textContent = '...';
try {
const data = await apiCall('/api/generate-code', {});
document.getElementById('newCode').textContent = data.code;
} catch(e) { document.getElementById('newCode').textContent = 'خطأ'; }
}

function copyCode() {
const code = document.getElementById('newCode').textContent;
if (navigator.clipboard) navigator.clipboard.writeText(code);
notify('📋 تم النسخ', 'success');
}

function openTerminal() {
const t = document.getElementById('terminalContainer');
t.style.display = 'flex';
terminalOpen = true;
if (!currentEventSource) startTerminalStream();
}
function toggleTerminal() {
const t = document.getElementById('terminalContainer');
if (t.style.display === 'none' || !t.style.display) openTerminal();
else { t.style.display = 'none'; terminalOpen = false; }
}
function clearTerminal() {
document.getElementById('terminalBody').innerHTML = '';
}
function startTerminalStream() {
if (currentEventSource) currentEventSource.close();
currentEventSource = new EventSource(BACKEND_URL + '/api/terminal/' + SESSION_ID);
currentEventSource.onmessage = function(event) {
try {
const data = JSON.parse(event.data);
if (data.message) addTermLine(data.message);
} catch(e) {}
};
currentEventSource.onerror = function() {
setTimeout(() => { if (terminalOpen) startTerminalStream(); }, 3000);
};
}
function addTermLine(msg) {
const body = document.getElementById('terminalBody');
const line = document.createElement('div');
line.className = 'term-line';
let cls = 'term-default';
if (msg.includes('❌') || msg.includes('خطأ')) cls = 'term-error';
else if (msg.includes('✅')) cls = 'term-success';
else if (msg.includes('⚠️')) cls = 'term-warn';
else if (msg.includes('🚀') || msg.includes('📊') || msg.includes('🔄') || msg.includes('🔐') || msg.includes('📱') || msg.includes('📦')) cls = 'term-info';
const time = new Date().toLocaleTimeString('ar-EG', { hour12: false });
line.innerHTML = `<span class="term-time">[${time}]</span><span class="${cls}">${escapeHtml(msg)}</span>`;
body.appendChild(line);
body.scrollTop = body.scrollHeight;
}
function termLog(msg, type) { addTermLine(msg); }
function escapeHtml(s) {
return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function notify(msg, type) {
const div = document.createElement('div');
div.className = 'notification ' + (type || 'info');
div.textContent = msg;
document.body.appendChild(div);
setTimeout(() => div.remove(), 3500);
}

window.addEventListener('load', () => {
if (localStorage.getItem('loggedIn')) {
showMainPage();
}
});
</script>
